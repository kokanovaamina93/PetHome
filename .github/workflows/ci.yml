
name: PetHome CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Check PetHome
    runs-on: ubuntu-latest

    steps:
      # 1. Получение кода
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python backend
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python version
        run: python --version

      - name: Check repository structure
        run: |
          ls -la
          ls -la backend
          ls -la src

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Check backend imports
        run: |
          python -c "import fastapi; print('FastAPI OK')"
          python -c "import sqlalchemy; print('SQLAlchemy OK')"
          python -c "import uvicorn; print('Uvicorn OK')"

      # 3. Проверка качества кода
      - name: Install testing tools
        run: |
          python -m pip install ruff pytest pytest-cov httpx

      - name: Check Python code with Ruff
        run: |
          python -m ruff check backend --select E4,E7,E9,F63,F7,F82

      # 4. Автоматические тесты и покрытие
      - name: Run automated tests with coverage
        run: |
          python -m pytest tests/ -v --cov=backend --cov-report=term-missing

      - name: Check Python syntax
        run: |
          python -m compileall -q backend

      # 5. React frontend
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build React frontend
        run: npm run build

      # 6. Сохранение готового frontend
      - name: Upload React build artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pethome-frontend
          path: dist/
          if-no-files-found: error
          retention-days: 7
